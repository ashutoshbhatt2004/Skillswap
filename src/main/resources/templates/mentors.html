<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSwap | Mentors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link th:href="@{/style.css}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">SkillSwap</a>
      </div>
    </nav>

    <main class="container py-5">
      <section class="dashboard-hero card border-0 shadow-sm rounded-4 p-4 p-md-5 mb-4">
        <div class="row align-items-center g-4">
          <div class="col-lg-8">
            <p class="text-primary fw-semibold mb-2">Admin — Mentors</p>
            <h1 class="display-6 fw-bold mb-3">Registered Mentors</h1>
            <p class="text-muted mb-0">All mentors registered on the platform.</p>
          </div>
        </div>
      </section>

      <section class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <div class="table-responsive">
          <table class="table dashboard-table align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Role</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="m : ${mentors}">
                <td th:text="${m.id}">1</td>
                <td th:text="${m.fullName}">Jane Mentor</td>
                <td th:text="${m.email}">jane@example.com</td>
                <td th:text="${m.role}">MENTOR</td>
              </tr>
              <tr th:if="${mentors == null or #lists.isEmpty(mentors)}">
                <td colspan="4" class="text-muted small">No mentors found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="footer bg-primary text-white pt-5 pb-3 mt-4">
      <div class="container">
        <div class="text-center text-white-50 small pt-2">© 2026 SkillSwap. All Rights Reserved.</div>
      </div>
    </footer>
  </body>
</html>
