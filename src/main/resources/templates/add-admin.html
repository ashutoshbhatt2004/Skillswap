<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link th:href="@{/style.css}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">SkillSwap</a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
              <p class="text-primary fw-semibold mb-2">Admin Management</p>
              <h2 class="fw-bold">Create New Admin</h2>
              <p class="text-muted mb-0">Only administrators can create additional admin accounts.</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger text-center small p-2 mb-3" th:text="${param.error}"></div>
            <div th:if="${param.success}" class="alert alert-success text-center small p-2 mb-3" th:text="${param.success}"></div>

            <form th:action="@{/admin/add-admin}" method="POST">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <div class="row g-3">
                <div class="col-md-12">
                  <label class="form-label fw-semibold">Full Name</label>
                  <input type="text" name="fullName" class="form-control" placeholder="Full name" />
                </div>
                <div class="col-md-12">
                  <label class="form-label fw-semibold">Email</label>
                  <input type="email" name="email" class="form-control" placeholder="email@example.com" />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Password</label>
                  <input type="password" name="password" class="form-control" placeholder="Password" />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Confirm Password</label>
                  <input type="password" name="confirmPassword" class="form-control" placeholder="Confirm password" />
                </div>
              </div>

              <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Create Admin</button>
                <a th:href="@{/admin-dashboard}" class="btn btn-outline-secondary">Back to Dashboard</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer bg-primary text-white pt-5 pb-3 mt-4">
      <div class="container">
        <div class="text-center text-white-50 small pt-2">© 2026 SkillSwap. All Rights Reserved.</div>
      </div>
    </footer>
  </body>
</html>
