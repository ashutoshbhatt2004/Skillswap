<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Reviews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link th:href="@{/style.css}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">SkillSwap</a>
      </div>
    </nav>

    <main class="container py-5">
      <section class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <div class="row g-4">
          <div class="col-lg-8">
            <p class="text-primary fw-semibold mb-2">All Reviews</p>
            <h1 class="display-6 fw-bold mb-3">Platform-wide Reviews</h1>
            <p class="text-muted mb-0">All reviews submitted by students for completed sessions.</p>
          </div>
        </div>
      </section>

      <section class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <div class="table-responsive">
          <table class="table dashboard-table align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Mentor</th>
                <th>Skill</th>
                <th>Rating</th>
                <th>Comment</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="rv : ${reviews}">
                <td th:text="${rv.id}">1</td>
                <td th:text="${rv.request != null and rv.request.student != null} ? ${rv.request.student.fullName} : 'N/A'">Student Name</td>
                <td th:text="${rv.request != null and rv.request.skill != null and rv.request.skill.mentor != null} ? ${rv.request.skill.mentor.fullName} : 'N/A'">Mentor Name</td>
                <td th:text="${rv.request != null and rv.request.skill != null} ? ${rv.request.skill.name} : 'N/A'">Skill Name</td>
                <td th:text="${rv.rating}">5</td>
                <td th:text="${rv.comment}">Great session</td>
                <td th:text="${#temporals.format(rv.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-23 12:00</td>
              </tr>
              <tr th:if="${reviews == null or #lists.isEmpty(reviews)}">
                <td colspan="7" class="text-muted small">No reviews found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="footer bg-primary text-white pt-5 pb-3 mt-4">
      <div class="container">
        <div class="text-center text-white-50 small pt-2">© 2026 SkillSwap. All Rights Reserved.</div>
      </div>
    </footer>
  </body>
</html>
