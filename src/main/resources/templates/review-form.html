<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Give Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link th:href="@{/style.css}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">SkillSwap</a>
      </div>
    </nav>

    <main class="container py-5">
      <section class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <div class="row g-4">
          <div class="col-lg-8">
            <p class="text-primary fw-semibold mb-2">Give Your Review</p>
            <h1 class="display-6 fw-bold mb-3">Share feedback about your session</h1>
            <p class="text-muted mb-0">Please be honest and constructive.</p>
          </div>
        </div>
      </section>

      <section class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <form th:action="@{/reviews/create/{requestId}(requestId=${request.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="mb-3">
            <label class="form-label">Skill</label>
            <input class="form-control" type="text" th:value="${request.skill.name}" readonly />
          </div>
          <div class="mb-3">
            <label class="form-label">Mentor</label>
            <input class="form-control" type="text" th:value="${request.skill.mentor.fullName}" readonly />
          </div>
          <div class="mb-3">
            <label class="form-label">Rating</label>
            <select name="rating" class="form-select">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Comment</label>
            <textarea name="comment" class="form-control" rows="4"></textarea>
          </div>
          <div>
            <button class="btn btn-primary" type="submit">Submit Review</button>
            <a th:href="@{/requests/sent}" class="btn btn-link">Cancel</a>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer bg-primary text-white pt-5 pb-3 mt-4">
      <div class="container">
        <div class="text-center text-white-50 small pt-2">© 2026 SkillSwap. All Rights Reserved.</div>
      </div>
    </footer>
  </body>
</html>
